<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prajwal Roshan Madame | Graduate Geologist & Exploration Specialist</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0A0E12;
            --bg-grid: #121820;
            --panel: #121A21;
            --panel-hover: #19232D;
            --border: #222E3A;
            --border-highlight: #3FA796;
            --text-primary: #F0F4F8;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --teal: #3FA796;
            --teal-glow: rgba(63, 167, 150, 0.15);
            --amber: #D98E3B;
            --blue-accent: #3B82F6;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(63, 167, 150, 0.08) 0%, transparent 50%),
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout Container */
        .container {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Navigation Bar */
        nav {
            position: sticky;
            top: 20px;
            z-index: 100;
            margin-bottom: 60px;
        }

        .nav-inner {
            background: rgba(18, 26, 33, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 16px;
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            background: var(--teal);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--teal);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--teal);
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(63, 167, 150, 0.1);
            border: 1px solid rgba(63, 167, 150, 0.3);
            padding: 6px 14px;
            border-radius: 999px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--teal);
            margin-bottom: 24px;
        }

        .status-pulse {
            width: 8px;
            height: 8px;
            background-color: var(--teal);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(63, 167, 150, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(63, 167, 150, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(63, 167, 150, 0); }
        }

        /* Hero Section */
        .hero {
            padding: 40px 0 80px;
        }

        .hero h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 48px;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #FFFFFF 30%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 20px;
            color: var(--teal);
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .hero p {
            font-size: 17px;
            color: var(--text-secondary);
            max-width: 760px;
            margin-bottom: 36px;
        }

        .cta-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--teal);
            color: #0A0E12;
            border: 1px solid var(--teal);
        }

        .btn-primary:hover {
            background: #4DC3B0;
            box-shadow: 0 0 20px rgba(63, 167, 150, 0.4);
        }

        .btn-secondary {
            background: var(--panel);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--teal);
            background: var(--panel-hover);
        }

        /* Section Styling */
        section {
            padding: 60px 0;
            border-top: 1px solid var(--border);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px;
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .section-tag {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--teal);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Featured Application Card (Strata) */
        .featured-card {
            background: linear-gradient(135deg, var(--panel) 0%, #17242E 100%);
            border: 1px solid var(--border-highlight);
            border-radius: var(--radius-lg);
            padding: 36px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px var(--teal-glow);
            margin-bottom: 40px;
            transition: transform 0.2s;
        }

        .featured-card:hover {
            transform: translateY(-2px);
        }

        .featured-badge {
            display: inline-block;
            background: var(--teal);
            color: #0A0E12;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .featured-card h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #FFFFFF;
        }

        .featured-card p {
            color: var(--text-secondary);
